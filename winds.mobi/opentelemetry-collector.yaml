receivers:
  otlp:
    protocols:
      grpc:

processors:
  attributes/environment:
    actions:
      # https://opentelemetry.io/docs/specs/semconv/resource/deployment-environment/
      - key: deployment.environment.name
        action: insert
        value: ${ENVIRONMENT}
  tail_sampling:
    decision_wait: 10s
    num_traces: 10000
    expected_new_traces_per_sec: 10
    policies:
      - name: errors-policy
        type: status_code
        status_code:
          status_codes: [ ERROR ]
      - name: latency-policy
        type: latency
        latency:
          threshold_ms: 2000
  batch:
    send_batch_size: 10000
    timeout: 10s

exporters:
  sentry:
    dsn: ${SENTRY_URL}
    environment: ${ENVIRONMENT}

service:
  pipelines:
    traces/sentry:
      receivers: [ otlp ]
      processors: [ attributes/environment, tail_sampling, batch ]
      exporters: [ sentry ]
